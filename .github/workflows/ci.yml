name: Full QA

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: full-qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  architecture:
    name: Content and architecture gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repository map, content, and semantic ownership
        run: npm run ci:architecture

  quality:
    name: Lint, Monster QA, unit tests, and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Monster QA
        if: ${{ !cancelled() }}
        run: npm run monster:qa

      - name: Unit tests
        if: ${{ !cancelled() }}
        run: npm run test:run

      - name: Production build
        if: ${{ !cancelled() }}
        run: npm run build

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        id: playwright-install
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Run end-to-end tests
        id: e2e
        if: steps.playwright-install.outcome == 'success'
        run: npm run test:e2e

      - name: Report browser-test failure
        if: always() && (steps.playwright-install.outcome == 'failure' || steps.e2e.outcome == 'failure')
        run: echo "::warning::Browser tests failed or Playwright could not be installed. Architecture and quality jobs remain the blocking checks."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
