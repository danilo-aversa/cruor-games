name: Full QA

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        id: playwright-install
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm run test:run

      - name: End-to-end tests
        id: e2e
        if: steps.playwright-install.outcome == 'success'
        continue-on-error: true
        run: npm run test:e2e

      - name: Report non-blocking E2E failure
        if: always() && (steps.playwright-install.outcome == 'failure' || steps.e2e.outcome == 'failure')
        run: echo "::warning::End-to-end tests failed or Playwright could not be installed. Build and unit tests remain the blocking checks."

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7
