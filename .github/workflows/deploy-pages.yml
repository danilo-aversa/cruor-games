name: Deploy Cruor Games to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      mode:
        description: Deployment mode
        required: true
        default: fast
        type: choice
        options:
          - fast
          - full

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && 'Full QA and deploy' || 'Fast deploy' }}
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        id: playwright-install
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Unit tests
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        run: npm run test:run

      - name: End-to-end tests
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && steps.playwright-install.outcome == 'success'
        id: e2e
        continue-on-error: true
        run: npm run test:e2e

      - name: Report non-blocking E2E failure
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full' && (steps.playwright-install.outcome == 'failure' || steps.e2e.outcome == 'failure')
        run: echo "::warning::End-to-end tests failed or Playwright could not be installed. The report is preserved, but deployment continues."

      - name: Upload Playwright report
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'full'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build Vite site
        env:
          CRUOR_PAGES_BASE: /
        run: npm run build

      - name: Verify built Pages artifact
        run: |
          test -f dist/index.html

          if grep -q '/app/main.jsx' dist/index.html; then
            echo "::error::dist/index.html still points to the uncompiled JSX entry point."
            exit 1
          fi

          if grep -q '/cruor-games/' dist/index.html; then
            echo "::error::The build still uses the repository subpath, but the custom domain is served from the root."
            exit 1
          fi

          if ! grep -q '"/assets/' dist/index.html; then
            echo "::error::dist/index.html does not contain root-relative asset paths for the custom domain."
            exit 1
          fi

      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
